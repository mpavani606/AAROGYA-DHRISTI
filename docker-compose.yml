services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/aarogya_drishti
      CLIENT_URL: http://localhost:5173
      PORT: 4000
      LOCAL_MEDIA_STORAGE: "true"
    ports:
      - "4000:4000"
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - media-data:/app/storage/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  seed:
    build: ./server
    command: ["node", "dist/seed.js"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/aarogya_drishti
      CLIENT_URL: http://localhost:5173
      LOCAL_MEDIA_STORAGE: "true"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - media-data:/app/storage/media

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
  media-data:
  client-node-modules:
